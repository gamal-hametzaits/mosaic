name: Deploy Mosaic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save wrangler
      - run: npx wrangler d1 execute mosaic-db --remote --file schema.sql
        working-directory: worker
      - run: printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
        working-directory: worker
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      - run: npx wrangler deploy
        working-directory: worker
